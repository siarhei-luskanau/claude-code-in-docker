services:
  claude:
    image: node:26-slim
    stdin_open: true
    tty: true
    init: true
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      SKIP_APT: ${SKIP_APT:-0}
      EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
      CLAUDE_DOCKER_UPDATE: ${CLAUDE_DOCKER_UPDATE:-0}
      NPM_CONFIG_PREFIX: /opt/claude-tools
    volumes:
      - ${PROJECT_DIR:?set by the claude-docker launcher}:/workspace
      - ${CLAUDE_DOCKER_HOME:?set by the claude-docker launcher}/entrypoint.sh:/entrypoint.sh:ro
      - ${CLAUDE_DOCKER_HOME}/tools:/opt/claude-tools
      - ${CLAUDE_DOCKER_HOME}/apt-cache/archives:/var/cache/apt/archives
      - ${CLAUDE_DOCKER_HOME}/apt-cache/lists:/var/lib/apt/lists
      - ${PROJECT_STATE_DIR:?set by the claude-docker launcher}/claude:/home/node/.claude
      - ${PROJECT_STATE_DIR}/claude.json:/home/node/.claude.json
      - ${HOME}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md:ro
      - ${HOME}/.claude/settings.json:/home/node/.claude/settings.json:ro
      - ${HOME}/.claude/commands:/home/node/.claude/commands:ro
      - ${HOME}/.claude/agents:/home/node/.claude/agents:ro
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
