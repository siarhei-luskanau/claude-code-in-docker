name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate YAML files
        run: |
          python3 -c "
          import yaml, sys
          files = ['docker-compose.yml']
          errors = []
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK: {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          export PROJECT_DIR="$PWD"
          export CLAUDE_DOCKER_HOME="$PWD"
          export PROJECT_STATE_DIR="$PWD/state/ci"
          docker compose config --quiet
          rm .env
